<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina la Suma</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
  <div id="app">
    <div id="home-screen" class="home-screen">
      <h1 class="home-title" data-i18n="app.title">Adivina la Suma</h1>
      <p class="home-subtitle" data-i18n="home.subtitle">Selecciona un nivel</p>
      <div class="level-buttons-container">
        <button class="level-button level-button--1" data-level="1" data-i18n="level.1">Nivel 1</button>
        <button class="level-button level-button--2" data-level="2" data-i18n="level.2">Nivel 2</button>
        <button class="level-button level-button--3" data-level="3" data-i18n="level.3">Nivel 3</button>
      </div>
      <button class="pets-button" id="btn-home-pets" data-i18n="button.pets">Mascotas</button>
    </div>
    <div id="game-screen" class="game-screen hidden">
      <div class="game-container">
        <div class="top-bar">
          <div class="gem-counter">
            <img src="/assets/images/gem.svg" alt="Gema" class="gem-icon-svg" />
            <span class="gem-count">0</span>
          </div>
          <div class="stats-counter">
            <span class="stat-hits">✅ <span class="hits-count">0</span></span>
            <span class="stat-errors">❌ <span class="errors-count">0</span></span>
          </div>
          <button id="btn-pet-catalog" class="btn-catalog" aria-label="Catálogo de mascotas">
            <svg class="paw-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 10.5c-1.5 0-2.7-1.2-2.7-2.7 0-.4.1-.8.2-1.1.3-.7 1-1.2 1.8-1.2h1.4c.8 0 1.5.5 1.8 1.2.1.3.2.7.2 1.1 0 1.5-1.2 2.7-2.7 2.7zM7.5 12c-1.4 0-2.5-1.1-2.5-2.5 0-.3.1-.7.2-1 .3-.6.9-1 1.6-1h.9c.7 0 1.3.4 1.6 1 .1.3.2.7.2 1 0 1.4-1.1 2.5-2 2.5zM16.5 12c-.9 0-2-1.1-2-2.5 0-.3.1-.7.2-1 .3-.6.9-1 1.6-1h.9c.7 0 1.3.4 1.6 1 .1.3.2.7.2 1 0 1.4-1.1 2.5-2.5 2.5zM12 14c-2.3 0-4.3 1.2-5.5 3-.4.6-.6 1.3-.6 2 0 1.7 1.3 3 3 3h6.2c1.7 0 3-1.3 3-3 0-.7-.2-1.4-.6-2-1.2-1.8-3.2-3-5.5-3z"/>
            </svg>
          </button>
          <div class="timer">
            <span class="timer-value">15</span>
            <span class="timer-label">s</span>
          </div>
        </div>
        <div class="level-badge">
          <span class="level-badge-text">Nivel 1</span>
        </div>
        <div class="operation-display">
          <div class="operation-content">
            <div class="operation-operator">+</div>
            <div class="operation-numbers">
              <div class="operation-operand operand-1">0</div>
              <div class="operation-operand operand-2">0</div>
            </div>
          </div>
          <div class="operation-line"></div>
        </div>
        <div class="input-area">
          <input type="text" class="answer-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <button id="btn-enter" class="btn-enter" data-i18n="button.enter">ENTER</button>
        </div>
        <div id="pet-area" class="pet-area">
          <div id="active-pet-container" class="active-pet"></div>
          <div id="pet-message-container" class="pet-message"></div>
        </div>
      </div>
    </div>
    <button id="btn-help" class="btn-help">
      <span class="help-icon">?</span>
      <span class="help-text" data-i18n="button.how">¿Cómo lo hago?</span>
    </button>
    <button id="btn-back" class="btn-back" data-i18n="button.back">Atrás</button>
    <div id="help-overlay" class="help-overlay hidden">
      <button id="btn-help-close" class="btn-help-close" aria-label="Cerrar ayuda">✕</button>
      <div class="help-overlay-content">
        <h3 class="help-overlay-title" data-i18n="help.title">Sumas Parciales</h3>
        <div id="help-steps" class="help-steps"></div>
      </div>
    </div>
    <div id="educational-feedback-overlay" class="educational-feedback-overlay hidden">
      <div class="educational-feedback-content">
        <div id="educational-feedback-steps" class="educational-feedback-steps"></div>
        <button id="btn-educational-feedback-continue" class="btn-educational-feedback-continue">Continuar aprendiendo</button>
      </div>
    </div>
    <div id="tutorial-screen" class="tutorial-screen hidden">
      <div class="tutorial-container">
        <h2 class="tutorial-title">Sumas Parciales</h2>
        <p class="tutorial-subtitle">Aprende a resolver sumas sin "llevar"</p>
        <div id="tutorial-steps" class="tutorial-steps"></div>
        <h3 class="tutorial-exercises-title">Practiquemos</h3>
        <div id="tutorial-exercises" class="tutorial-exercises"></div>
        <div class="tutorial-buttons">
          <button id="btn-tutorial-back" class="btn-tutorial-back" data-i18n="button.back">Atrás</button>
          <button id="btn-tutorial-start" class="btn-tutorial-start" data-i18n="button.start">Comenzar juego</button>
        </div>
      </div>
    </div>
    <div id="pet-catalog-container" class="pet-catalog-screen hidden">
      <button id="btn-close-catalog" class="btn-close" aria-label="Cerrar catálogo">✕</button>
      <h2 class="catalog-title" data-i18n="catalog.title">Mis Mascotas</h2>
      <div class="pet-grid"></div>
      <button id="btn-back-catalog" class="btn-back-catalog" data-i18n="button.back">Atrás</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
