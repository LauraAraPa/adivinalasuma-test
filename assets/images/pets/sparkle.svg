<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sparkle - Unicornio morado cuerpo completo -->
  <defs>
    <radialGradient id="sparkleBody" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#D4A5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="hornGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cola con estrellas -->
  <path d="M 70 75 Q 85 70 82 60 Q 80 55 77 60 Q 78 68 72 72" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1.5"/>
  <circle cx="82" cy="62" r="2" fill="#FFD700"/>
  <circle cx="80" cy="65" r="1.5" fill="#FFD700"/>
  
  <!-- Cuerpo -->
  <ellipse cx="50" cy="75" rx="25" ry="20" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1.5"/>
  
  <!-- Patas traseras -->
  <ellipse cx="38" cy="90" rx="8" ry="6" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1"/>
  <ellipse cx="62" cy="90" rx="8" ry="6" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="45" r="28" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1.5"/>
  
  <!-- Cuerno espiral -->
  <polygon points="50,18 45,2 55,2" fill="url(#hornGradient)" stroke="#E69500" stroke-width="1"/>
  <path d="M 47 14 L 53 14" stroke="#FFA500" stroke-width="1" opacity="0.6"/>
  <path d="M 48 10 L 52 10" stroke="#FFA500" stroke-width="1" opacity="0.6"/>
  <path d="M 49 6 L 51 6" stroke="#FFA500" stroke-width="1" opacity="0.6"/>
  
  <!-- Orejas -->
  <ellipse cx="30" cy="32" rx="7" ry="10" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1" transform="rotate(-20 30 32)"/>
  <ellipse cx="70" cy="32" rx="7" ry="10" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1" transform="rotate(20 70 32)"/>
  <ellipse cx="30" cy="34" rx="4" ry="7" fill="#FF69B4" opacity="0.6" transform="rotate(-20 30 34)"/>
  <ellipse cx="70" cy="34" rx="4" ry="7" fill="#FF69B4" opacity="0.6" transform="rotate(20 70 34)"/>
  
  <!-- Melena -->
  <path d="M 25 35 Q 18 30 22 40 Q 20 38 25 42" stroke="#FF69B4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 75 35 Q 82 30 78 40 Q 80 38 75 42" stroke="#FF69B4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 28 30 Q 22 25 28 28" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 72 30 Q 78 25 72 28" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Mejillas -->
  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FF69B4" opacity="0.6"/>
  <ellipse cx="62" cy="50" rx="5" ry="3" fill="#FF69B4" opacity="0.6"/>
  
  <!-- Ojos -->
  <ellipse cx="42" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <ellipse cx="58" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <circle cx="43" cy="43" r="4" fill="#9B59B6"/>
  <circle cx="59" cy="43" r="4" fill="#9B59B6"/>
  <circle cx="43" cy="43" r="2" fill="#2C3E50"/>
  <circle cx="59" cy="43" r="2" fill="#2C3E50"/>
  <circle cx="44" cy="41" r="2" fill="#FFFFFF"/>
  <circle cx="60" cy="41" r="2" fill="#FFFFFF"/>
  
  <!-- Pestañas -->
  <path d="M 38 38 L 36 35" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 42 37 L 41 34" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 58 37 L 59 34" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 62 38 L 64 35" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nariz -->
  <ellipse cx="50" cy="50" rx="4" ry="3" fill="#FF69B4"/>
  
  <!-- Boca -->
  <path d="M 46 55 Q 50 58 54 55" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Estrellas decorativas -->
  <circle cx="20" cy="28" r="2" fill="#FFD700"/>
  <circle cx="80" cy="28" r="2" fill="#FFD700"/>
  <circle cx="50" cy="12" r="2" fill="#FFD700"/>
  <circle cx="22" cy="42" r="1.5" fill="#FFD700" opacity="0.7"/>
  <circle cx="78" cy="42" r="1.5" fill="#FFD700" opacity="0.7"/>
  
  <!-- Patas delanteras -->
  <ellipse cx="42" cy="85" rx="6" ry="8" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1"/>
  <ellipse cx="58" cy="85" rx="6" ry="8" fill="url(#sparkleBody)" stroke="#A86FE0" stroke-width="1"/>
</svg>
