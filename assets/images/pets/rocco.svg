<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rocco - Zorro amarillo cuerpo completo -->
  <defs>
    <radialGradient id="roccoBody" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FFE566;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD93D;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cola esponjosa -->
  <path d="M 70 75 Q 90 70 85 55 Q 82 50 78 55 Q 80 65 70 70" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1.5"/>
  <path d="M 72 72 Q 85 68 82 58" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Cuerpo -->
  <ellipse cx="50" cy="75" rx="25" ry="20" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1.5"/>
  
  <!-- Patas traseras -->
  <ellipse cx="38" cy="90" rx="8" ry="6" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1"/>
  <ellipse cx="62" cy="90" rx="8" ry="6" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="45" r="28" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1.5"/>
  
  <!-- Orejas puntiagudas -->
  <polygon points="28,30 22,10 40,22" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1.5"/>
  <polygon points="72,30 78,10 60,22" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1.5"/>
  <polygon points="30,28 25,14 38,24" fill="#FF8C00"/>
  <polygon points="70,28 75,14 62,24" fill="#FF8C00"/>
  
  <!-- Máscara de zorro -->
  <path d="M 35 42 Q 42 37 50 40 Q 58 37 65 42 Q 62 50 50 50 Q 38 50 35 42 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Mejillas -->
  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FF8C00" opacity="0.4"/>
  <ellipse cx="62" cy="50" rx="5" ry="3" fill="#FF8C00" opacity="0.4"/>
  
  <!-- Ojos -->
  <ellipse cx="42" cy="42" rx="5" ry="6" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <ellipse cx="58" cy="42" rx="5" ry="6" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <circle cx="43" cy="43" r="3" fill="#2C3E50"/>
  <circle cx="59" cy="43" r="3" fill="#2C3E50"/>
  <circle cx="44" cy="41" r="1.5" fill="#FFFFFF"/>
  <circle cx="60" cy="41" r="1.5" fill="#FFFFFF"/>
  
  <!-- Nariz -->
  <ellipse cx="50" cy="50" rx="4" ry="3" fill="#2C3E50"/>
  
  <!-- Boca -->
  <path d="M 46 55 Q 50 58 54 55" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Hocico blanco -->
  <ellipse cx="50" cy="58" rx="15" ry="8" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 45 56 Q 50 58 55 56" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Patas delanteras -->
  <ellipse cx="42" cy="85" rx="6" ry="8" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1"/>
  <ellipse cx="58" cy="85" rx="6" ry="8" fill="url(#roccoBody)" stroke="#E6C235" stroke-width="1"/>
</svg>
