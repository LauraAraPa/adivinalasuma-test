<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Draco - Dragón rojo cuerpo completo -->
  <defs>
    <radialGradient id="dracoBody" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FF8E8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cola con punta -->
  <path d="M 70 75 Q 85 70 90 60 Q 92 55 88 58 Q 85 65 75 70" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1.5"/>
  <polygon points="88,58 95,55 90,62" fill="#FF4500"/>
  
  <!-- Alas -->
  <path d="M 25 60 Q 10 50 15 40 Q 18 35 22 40 Q 20 50 28 55 Z" fill="#FF6B6B" stroke="#E55A5A" stroke-width="1"/>
  <path d="M 75 60 Q 90 50 85 40 Q 82 35 78 40 Q 80 50 72 55 Z" fill="#FF6B6B" stroke="#E55A5A" stroke-width="1"/>
  
  <!-- Cuerpo -->
  <ellipse cx="50" cy="75" rx="25" ry="20" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1.5"/>
  
  <!-- Escamas del cuerpo -->
  <circle cx="40" cy="70" r="3" fill="#FF4500" opacity="0.5"/>
  <circle cx="50" cy="72" r="3" fill="#FF4500" opacity="0.5"/>
  <circle cx="60" cy="70" r="3" fill="#FF4500" opacity="0.5"/>
  
  <!-- Patas traseras -->
  <ellipse cx="38" cy="90" rx="8" ry="6" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1"/>
  <ellipse cx="62" cy="90" rx="8" ry="6" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="45" r="28" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1.5"/>
  
  <!-- Cuernos -->
  <polygon points="30,28 25,8 40,22" fill="#FF4500" stroke="#CC3700" stroke-width="1.5"/>
  <polygon points="70,28 75,8 60,22" fill="#FF4500" stroke="#CC3700" stroke-width="1.5"/>
  <polygon points="32,26 28,12 38,24" fill="#FFD700" opacity="0.6"/>
  <polygon points="68,26 72,12 62,24" fill="#FFD700" opacity="0.6"/>
  
  <!-- Escamas de la cabeza -->
  <circle cx="35" cy="38" r="3" fill="#FF4500" opacity="0.5"/>
  <circle cx="65" cy="38" r="3" fill="#FF4500" opacity="0.5"/>
  <circle cx="50" cy="28" r="3" fill="#FF4500" opacity="0.5"/>
  
  <!-- Mejillas -->
  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FF4500" opacity="0.4"/>
  <ellipse cx="62" cy="50" rx="5" ry="3" fill="#FF4500" opacity="0.4"/>
  
  <!-- Ojos -->
  <ellipse cx="42" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <ellipse cx="58" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <circle cx="43" cy="43" r="4" fill="#FFD700"/>
  <circle cx="59" cy="43" r="4" fill="#FFD700"/>
  <circle cx="43" cy="43" r="2" fill="#2C3E50"/>
  <circle cx="59" cy="43" r="2" fill="#2C3E50"/>
  <circle cx="44" cy="41" r="1.5" fill="#FFFFFF"/>
  <circle cx="60" cy="41" r="1.5" fill="#FFFFFF"/>
  
  <!-- Nariz -->
  <ellipse cx="50" cy="50" rx="5" ry="3" fill="#FF4500"/>
  <circle cx="48" cy="49" r="1.5" fill="#2C3E50"/>
  <circle cx="52" cy="49" r="1.5" fill="#2C3E50"/>
  
  <!-- Boca -->
  <path d="M 45 57 Q 50 60 55 57" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Patas delanteras -->
  <ellipse cx="42" cy="85" rx="6" ry="8" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1"/>
  <ellipse cx="58" cy="85" rx="6" ry="8" fill="url(#dracoBody)" stroke="#E55A5A" stroke-width="1"/>
</svg>
