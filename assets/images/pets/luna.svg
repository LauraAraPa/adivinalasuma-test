<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Luna - Gatito cuerpo completo estilo cartoon -->
  <defs>
    <radialGradient id="lunaBody" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#7DD3F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BC0EB;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cuerpo -->
  <ellipse cx="50" cy="75" rx="25" ry="20" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1.5"/>
  
  <!-- Cola -->
  <path d="M 70 75 Q 85 70 80 60 Q 78 55 75 58" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1.5"/>
  
  <!-- Patas traseras -->
  <ellipse cx="38" cy="90" rx="8" ry="6" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1"/>
  <ellipse cx="62" cy="90" rx="8" ry="6" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="45" r="28" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1.5"/>
  
  <!-- Orejas -->
  <path d="M 30 30 L 25 10 L 40 22 Z" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1.5"/>
  <path d="M 70 30 L 75 10 L 60 22 Z" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1.5"/>
  <path d="M 32 28 L 28 14 L 38 24 Z" fill="#FFB6C1"/>
  <path d="M 68 28 L 72 14 L 62 24 Z" fill="#FFB6C1"/>
  
  <!-- Mejillas -->
  <ellipse cx="38" cy="50" rx="5" ry="3" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="62" cy="50" rx="5" ry="3" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Ojos grandes -->
  <ellipse cx="42" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <ellipse cx="58" cy="42" rx="6" ry="7" fill="#FFFFFF" stroke="#2C3E50" stroke-width="0.5"/>
  <circle cx="43" cy="43" r="4" fill="#2C3E50"/>
  <circle cx="59" cy="43" r="4" fill="#2C3E50"/>
  <circle cx="44" cy="41" r="2" fill="#FFFFFF"/>
  <circle cx="60" cy="41" r="2" fill="#FFFFFF"/>
  
  <!-- Nariz -->
  <ellipse cx="50" cy="50" rx="3" ry="2" fill="#FF69B4"/>
  
  <!-- Boca -->
  <path d="M 47 54 Q 50 57 53 54" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Bigotes -->
  <line x1="28" y1="48" x2="18" y2="45" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  <line x1="28" y1="52" x2="18" y2="52" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  <line x1="28" y1="56" x2="18" y2="59" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  <line x1="72" y1="48" x2="82" y2="45" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  <line x1="72" y1="52" x2="82" y2="52" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  <line x1="72" y1="56" x2="82" y2="59" stroke="#2C3E50" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Patas delanteras -->
  <ellipse cx="42" cy="85" rx="6" ry="8" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1"/>
  <ellipse cx="58" cy="85" rx="6" ry="8" fill="url(#lunaBody)" stroke="#4AA8D8" stroke-width="1"/>
</svg>
